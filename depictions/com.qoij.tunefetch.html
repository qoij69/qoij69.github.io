<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>TuneFetch</title><style>body{font-family:-apple-system,Helvetica,sans-serif;margin:16px;color:#222}h1{font-size:20px}code{background:#eee;padding:1px 4px}</style></head><body><h1>TuneFetch <small>0.2.0-1+debug</small></h1><p>Downloads new music from your TuneFetch Host PC in the background</p><p><b>Setup:</b> Settings &rarr; TuneFetch &rarr; enter your PC's address (e.g. <code>192.168.178.29</code>), then start <code>tunefetch_host.py</code> on the PC and press Start.</p><p><b>Requires:</b> iOS 6.0 or later, PreferenceLoader.</p></body></html>
